services:
  rest_api:
    container_name: rest_api
    build:
      dockerfile: Dockerfile
    ports:
      - ${API_PORT}:${API_PORT}
    networks:
      - rest_api_network
    env_file:
      - .env
    depends_on:
      - db
  
  db:
    image: postgres
    restart: always
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_network
      - rest_api_network
    ports:
      - 5432:5432
  
  adminer:
    image: adminer
    restart: always
    container_name: admin_interface
    ports:
      - 8080:8080
    networks:
      - db_network
    depends_on:
      - db

networks:
  rest_api_network:
    driver: bridge
    name: rest_api_network
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

  db_network:
    driver: bridge
    name: db_network
    ipam:
      config:
        - subnet: 192.168.200.0/24
          gateway: 192.168.200.1

volumes:
  pgdata:
    driver: local